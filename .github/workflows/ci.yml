name: Verify StreetQuest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build:windows
      - name: Verify packaged Windows app offline
        shell: pwsh
        run: |
          $env:STREETQUEST_WINDOWS_EXE = (Get-ChildItem release -Filter StreetQuest.exe -Recurse | Select-Object -First 1).FullName
          pnpm exec playwright test e2e/windows.spec.ts e2e/offline.spec.ts e2e/package-transfer.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: StreetQuest-windows-x64
          path: release/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreetQuest-windows-x64
          path: release
      - name: Package verified Windows build
        shell: pwsh
        run: |
          $folder = Get-ChildItem release -Directory | Select-Object -First 1
          $zip = "StreetQuest-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path $folder.FullName -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME StreetQuest-*-win-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "StreetQuest $env:GITHUB_REF_NAME"
